
[package]
name = "filekit"
version = "0.1.0"
edition = "2021"
description = "A reusable binary file processing library"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# Authenticated encryption: protects data and detects tampering.
aes-gcm = "0.10"

# Derive a cryptographic key from a passphrase and random salt.
pbkdf2 = "0.12"
sha2 = "0.10"

# Cryptographically secure random bytes on native and WASM targets.
getrandom = { version = "0.2", features = ["js"] }

# Erase key material from memory when its wrapper is dropped.
zeroize = { version = "1", features = ["zeroize_derive"] }

# Convert ordinary Rust errors into readable messages.
thiserror = "2"

rpassword = "7"
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Provides the bridge between Rust and browser JavaScript.
wasm-bindgen = "0.2"